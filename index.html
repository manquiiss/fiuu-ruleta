<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Fiuu · Ruleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#FFF8E5;
    --rojo:#F44236;
    --amarillo:#FEB800;
    --negro:#1A1A1A;
    --blanco:#FFFFFF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--crema);
    color:var(--negro);
    font-family:'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  /* background blobs for a bit of energy */
  body::before, body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    z-index:0;
    filter:blur(2px);
  }
  body::before{
    width:340px; height:340px;
    background:var(--amarillo);
    opacity:.25;
    top:-120px; left:-120px;
  }
  body::after{
    width:280px; height:280px;
    background:var(--rojo);
    opacity:.15;
    bottom:-100px; right:-100px;
  }

  header{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 20px 8px;
    z-index:1;
  }

  .logo{
    font-family:'Baloo 2', 'Poppins', cursive, sans-serif;
    font-size:2rem;
    font-weight:800;
    letter-spacing:.5px;
    color:var(--rojo);
  }

  .hero{
    text-align:center;
    padding:8px 24px 4px;
    max-width:480px;
    z-index:1;
  }

  .hero h1{
    font-size:1.2rem;
    line-height:1.3;
    color:var(--negro);
  }

  .wheel-zone{
    position:relative;
    width:min(90vw, 380px);
    height:min(90vw, 380px);
    margin:28px auto 12px;
    z-index:1;
  }

  @media (min-width:640px){
    .wheel-zone{
      width:min(55vw, 480px);
      height:min(55vw, 480px);
    }
  }

  @media (min-width:1024px){
    .wheel-zone{
      width:min(38vw, 620px);
      height:min(38vw, 620px);
    }
  }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:32px solid var(--negro);
    z-index:5;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .pointer::after{
    content:"";
    position:absolute;
    top:-32px; left:-14px;
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:26px solid var(--amarillo);
  }

  .wheel-outer{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--blanco);
    padding:10px;
    box-shadow:
      0 0 0 6px var(--amarillo),
      0 12px 30px rgba(26,26,26,.25);
  }

  .wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    transition: transform 15s cubic-bezier(.15,0,.22,1);
    box-shadow: inset 0 0 0 3px rgba(26,26,26,.08);
  }

  .seg-label-wrap{
    position:absolute;
    inset:0;
    transform-origin:50% 50%;
    pointer-events:none;
  }

  .seg-label-wrap span{
    position:absolute;
    top:10%;
    left:50%;
    transform:translateX(-50%);
    display:inline-block;
    max-width:90px;
    font-weight:800;
    font-size:.9rem;
    line-height:1.1;
    text-align:center;
    color:var(--blanco);
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    white-space:normal;
  }

  .seg-label-wrap span.label-win{
    max-width:60px;
    font-size:.74rem;
    line-height:1.05;
  }

  @media (min-width:640px){
    .seg-label-wrap span{ font-size:1.1rem; max-width:115px; }
    .seg-label-wrap span.label-win{ font-size:.85rem; max-width:75px; }
  }

  @media (min-width:1024px){
    .seg-label-wrap span{ font-size:1.4rem; max-width:150px; }
    .seg-label-wrap span.label-win{ font-size:1.05rem; max-width:95px; }
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    width:37.8%; height:37.8%;
    transform:translate(-50%,-50%);
    background:var(--rojo);
    border-radius:50%;
    border:4px solid var(--blanco);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:4;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }

  .hub img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  .spin-btn{
    margin-top:18px;
    padding:16px 48px;
    font-size:1.15rem;
    font-weight:800;
    color:var(--blanco);
    background:var(--rojo);
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 0 #c62a20, 0 12px 20px rgba(0,0,0,.25);
    transition:transform .08s ease;
    z-index:1;
    letter-spacing:.5px;
  }
  .spin-btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #c62a20, 0 4px 10px rgba(0,0,0,.25);
  }
  .spin-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
    box-shadow:0 8px 0 #c62a20, 0 12px 20px rgba(0,0,0,.25);
  }

  .spins-left{
    margin-top:10px;
    font-size:.85rem;
    color:#6b6b6b;
    z-index:1;
  }


  /* Result modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(26,26,26,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:20px;
  }
  .overlay.show{ display:flex; }

  .modal{
    background:var(--crema);
    border-radius:24px;
    padding:32px 28px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    border:4px solid var(--amarillo);
    animation:pop .35s ease;
  }

  @keyframes pop{
    from{ transform:scale(.8); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .modal-logo{
    width:84px;
    height:84px;
    border-radius:50%;
    display:block;
    margin:0 auto 16px;
    box-shadow:0 6px 16px rgba(0,0,0,.2);
  }

  .modal .tag{
    display:block;
    font-size:1.8rem;
    font-weight:900;
    color:var(--rojo);
    margin-bottom:12px;
    letter-spacing:.5px;
  }

  .modal .prize-name{
    font-size:1.05rem;
    font-weight:600;
    line-height:1.45;
    color:var(--negro);
    margin:0 0 22px;
  }

  .cta-btn{
    display:inline-block;
    width:100%;
    padding:16px;
    background:var(--rojo);
    color:var(--blanco);
    font-weight:800;
    font-size:1.05rem;
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 6px 0 #c62a20;
    text-decoration:none;
  }

  .cta-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #c62a20;
  }

  @media (max-height:700px){
    .logo{font-size:1.9rem;}
    .hero h1{font-size:1.05rem;}
    .wheel-zone{margin:18px auto 8px;}
  }
</style>
</head>
<body>

  <header>
    <div class="logo">Fiuu</div>
  </header>

  <div class="hero">
    <h1>Girá y que tu comercio mejore</h1>
  </div>

  <div class="wheel-zone">
    <div class="pointer"></div>
    <div class="wheel-outer">
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="hub">
      <img src="logo.png" alt="Fiuu">
    </div>
  </div>

  <button class="spin-btn" id="spinBtn">GIRAR AHORA</button>
  <div class="spins-left" id="spinsLeft">Tenés 1 giro</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <img class="modal-logo" src="logo.png" alt="Fiuu">
      <span class="tag">FELICIDADES!!</span>
      <div class="prize-name" id="prizeName">Inscribite a fiuu GRATIS y que tu negocio le llegue a mas personas.</div>
      <a href="https://comercios.fiuu.app/#anotarme" class="cta-btn" id="ctaBtn">Anotate en FIUU gratis</a>
    </div>
  </div>

<script>
(function(){
  // Segments have unequal widths — PREMIO MAYOR is deliberately narrow so it
  // looks like a long shot, even though the wheel is rigged to always land there.
  const WIN_ANGLE = 20; // degrees given to the winning slice
  const OTHER_ANGLE = (360 - WIN_ANGLE) / 7;
  const prizes = [
    { label:"Visibilidad",     color:"#F44236", angle:OTHER_ANGLE },
    { label:"Más clientes",    color:"#FEB800", angle:OTHER_ANGLE },
    { label:"Más alcance",     color:"#F44236", angle:OTHER_ANGLE },
    { label:"Más ventas",      color:"#FEB800", angle:OTHER_ANGLE },
    { label:"Más pedidos",     color:"#F44236", angle:OTHER_ANGLE },
    { label:"Más seguidores",  color:"#FEB800", angle:OTHER_ANGLE },
    { label:"Efectividad",     color:"#F44236", angle:OTHER_ANGLE },
    { label:"PREMIO MAYOR",    color:"#1A1A1A", angle:WIN_ANGLE, win:true },
  ];

  const wheelEl = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const spinsLeftEl = document.getElementById('spinsLeft');
  const overlay = document.getElementById('overlay');

  // Precompute each segment's start/mid/end from its own angle (cumulative).
  let cursor = 0;
  prizes.forEach(p => {
    p.start = cursor;
    p.end = cursor + p.angle;
    p.mid = cursor + p.angle / 2;
    cursor = p.end;
  });

  // Build conic-gradient background for crisp segment colors
  const gradientStops = prizes.map(p => `${p.color} ${p.start}deg ${p.end}deg`);
  wheelEl.style.background = `conic-gradient(${gradientStops.join(',')})`;

  // Place labels: each wrapper spans the full wheel and is rotated so its
  // top-center point (where the span sits) lands at the segment's mid-angle.
  prizes.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'seg-label-wrap';
    wrap.style.transform = `rotate(${p.mid}deg)`;
    const span = document.createElement('span');
    span.textContent = p.label;
    if (p.win) span.classList.add('label-win');
    wrap.appendChild(span);
    wheelEl.appendChild(wrap);
  });

  let currentRotation = 0;
  let spinsUsed = 0;
  const maxSpins = 1;
  let spinning = false;

  const winIndex = prizes.findIndex(p => p.win);
  const winPrize = prizes[winIndex];

  const SPIN_DURATION_MS = 15000; // must match the .wheel transition duration

  function spin(){
    if (spinning || spinsUsed >= maxSpins) return;
    spinning = true;
    spinBtn.disabled = true;

    // The wheel spins clockwise, so a segment is entered from its END edge
    // first (the pointer's layout-angle decreases as rotation increases).
    // Landing just short of PREMIO MAYOR's end edge means it only just
    // crossed into the segment — reads as a narrow escape, not a dead-center win.
    const edgeOffset = 1.5 + Math.random() * 3; // 1.5–4.5° in from the entry edge
    const targetAngle = winPrize.end - edgeOffset;
    const baseAngle = (360 - targetAngle) % 360;
    const extraSpins = 13;

    const finalRotation = currentRotation - (currentRotation % 360) + extraSpins * 360 + baseAngle;
    currentRotation = finalRotation;
    wheelEl.style.transform = `rotate(${finalRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinsUsed++;
      overlay.classList.add('show');
      if (spinsUsed >= maxSpins){
        spinBtn.disabled = true;
        spinsLeftEl.textContent = "Ya usaste tu giro";
      } else {
        spinBtn.disabled = false;
      }
    }, SPIN_DURATION_MS);
  }

  spinBtn.addEventListener('click', spin);
})();
</script>

</body>
</html>
